# author: Stephen Eaton
# Validate, scan, build and deploy the site to GitHub Pages on every push to main. PRs run validation + build + scan only.
# Nothing deploys unless the prompt-injection scan of both source and built output passes.
name: Deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'   # daily 06:17 AWST: refresh the GitHub star count
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run build
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: bun run linkcheck
      - run: bun run versions
      - run: bun run security
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: dist }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    concurrency: { group: pages, cancel-in-progress: false }
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

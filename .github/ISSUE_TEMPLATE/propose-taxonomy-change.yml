# author: Stephen Eaton
# GENERATED by scripts/gen-issue-forms.ts from taxonomy/*.yaml — do not edit by hand.
name: Propose a taxonomy change
description: Add, rename or retire a domain concept.
title: "[Taxonomy]: "
labels:
  - proposal
  - taxonomy
body:
  - type: markdown
    attributes:
      value: "Read [Extend the taxonomy](https://agentpractices.dev/contributing/extend-the-taxonomy/) first. IDs are permanent: renames change the label only; retirement deprecates with a replacement."
  - type: dropdown
    id: change
    attributes:
      label: Change
      options:
        - Add a concept
        - Rename a concept (label only)
        - Retire a concept (deprecate)
    validations:
      required: true
  - type: dropdown
    id: parent
    attributes:
      label: Parent domain
      options:
        - None (new top-level domain)
        - D.AGT — Agent Engineering
        - D.MAS — Multi-Agent Systems
        - D.KNO — Knowledge Modelling
        - D.SWE — Software Engineering
        - D.SEC — Security & Safety
        - D.OPS — Operations
        - D.DOC — Documentation & Writing
    validations:
      required: true
  - type: input
    id: label
    attributes:
      label: Proposed label
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Definition
      description: 'Genus + differentia: "A <parent> practice governing …".'
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question it answers
      description: Which practices would live here, and why no existing concept covers them (quote the closest definitions).
    validations:
      required: true
  - type: input
    id: replaced_by
    attributes:
      label: Replaced by (retirements only)
      description: Concept ID that replaces it.

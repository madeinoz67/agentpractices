# author: Stephen Eaton
# GENERATED by scripts/gen-issue-forms.ts from taxonomy/*.yaml — do not edit by hand.
name: Propose a practice
description: Propose a new best practice. The owner assigns the BP-NNNN ID when the proposal is accepted.
title: "[Practice]: "
labels:
  - proposal
  - practice
body:
  - type: markdown
    attributes:
      value: "Read [Add a practice](https://agentpractices.dev/contributing/add-a-practice/) first. Do not pick an ID; the owner assigns one on acceptance. Agents filing this form: fill every required field and cite sources."
  - type: input
    id: practice_title
    attributes:
      label: Practice title
      description: Imperative, e.g. "Pin MCP server versions".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong today without this practice? Include an example if you have one.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Most specific concept that fits (see https://agentpractices.dev/taxonomy.json).
      options:
        - D.AGT — Agent Engineering
        - D.AGT.WF — Workflow
        - D.AGT.CTX — Context & Memory
        - D.AGT.TOOL — Tool Use
        - D.AGT.INS — Instructions & Prompting
        - D.AGT.SKL — Skills & Reusable Procedures
        - D.MAS — Multi-Agent Systems
        - D.MAS.TOP — Team Topologies & Roles
        - D.MAS.COM — Communication & Protocols
        - D.MAS.HND — Coordination & Handoff
        - D.KNO — Knowledge Modelling
        - D.KNO.TAX — Taxonomy
        - D.KNO.ONT — Ontology
        - D.KNO.SEM — Semantics & Metadata
        - D.KNO.KG — Knowledge Graphs
        - D.SWE — Software Engineering
        - D.SWE.CLI — CLI Design
        - D.SWE.API — API & Interface Design
        - D.SWE.TST — Testing
        - D.SWE.VCS — Version Control & Review
        - D.SWE.REL — Release Engineering
        - D.SWE.QLT — Code Quality & Comments
        - D.SWE.UI — UI & Design Systems
        - D.SEC — Security & Safety
        - D.SEC.INJ — Prompt Injection & Untrusted Input
        - D.SEC.PRV — Least Privilege & Secrets
        - D.SEC.SUP — Supply Chain
        - D.SEC.DEF — Defence Against Hostile Agents
        - D.SEC.DAT — Data Sovereignty & Privacy
        - D.SEC.OT — OT & Industrial Systems
        - D.SEC.FRM — AI Security Frameworks & Threat Modelling
        - D.SEC.CYD — AI-Enabled Cyber Defence
        - D.SEC.INF — Information Integrity & Influence Operations
        - D.OPS — Operations
        - D.OPS.OBS — Observability
        - D.OPS.EVL — Evaluation
        - D.OPS.CST — Cost & Performance
        - D.OPS.GW — Model Gateways & Routing
        - D.OPS.BDR — Backup & Recovery
        - D.DOC — Documentation & Writing
        - D.DOC.AGR — Agent-Readable Docs
        - D.DOC.HUM — Human-Readable Docs
        - D.DOC.SPC — Specs & Design Docs
        - None fits — needs a taxonomy change
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - guideline
        - pattern
        - anti-pattern
        - checklist
        - procedure
        - reference
    validations:
      required: true
  - type: dropdown
    id: roles
    attributes:
      label: Roles
      multiple: true
      options:
        - any
        - orchestrator
        - planner
        - implementer
        - reviewer
        - researcher
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      multiple: true
      options:
        - plan
        - build
        - verify
        - operate
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Draft rules
      description: Numbered, using MUST / SHOULD / MAY.
      placeholder: |-
        1. **MUST** …
        2. **SHOULD** …
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related or overlapping practices
      description: BP-IDs this relates to, extends or might duplicate.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Links to standards, docs or evidence. Each line is the link, then a note that says what it contributes to the rules.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing practices and open issues for duplicates
          required: true
        - label: The proposal contains no secrets or personal data
          required: true
